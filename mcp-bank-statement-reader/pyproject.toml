[project]
name = "mcp-bank-statement-reader"
version = "0.1.0"
description = "A local MCP server that reads bank statement PDFs, sorts spends into categories and finds repeat charges."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0",
    "pdfplumber>=0.11.0",
]

[project.scripts]
bank-reader-mcp = "bank_reader.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "fpdf2>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bank_reader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
